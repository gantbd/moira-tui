name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out Moira TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: moira-tui
          persist-credentials: false
      - name: Check out Keystone dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/keystone
          ref: 2e4faf10ec0a70805aa1db1555f93c77fcf0a1e4
          path: keystone
          persist-credentials: false
      - name: Check out Aegis dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/aegis
          ref: 0446e4fcf7412be9e0313523235d4e674d2fdd94
          path: aegis
          persist-credentials: false
      - name: Check out Agora dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/agora
          ref: 45b11bcd1e9b7b21e79faf8f1794f8379622f635
          path: agora
          persist-credentials: false
      - name: Check out Chronos dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/chronos
          ref: 26366ec9172b48280d9bba3688572edf1c0d2719
          path: chronos
          persist-credentials: false
      - name: Check out Daimon dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/daimon
          ref: ad70f838cf5533e1a28dcfff384fbfa432bd91da
          path: daimon
          persist-credentials: false
      - name: Check out Hermes dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/hermes
          ref: e666416071d1b5b6f4bdb7669a3984ef6d8a3162
          path: hermes
          persist-credentials: false
      - name: Check out Moira dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/moira
          ref: f7d35fc09e7b03dbe72ec96733817d9a01826c4f
          path: moira
          persist-credentials: false
      - name: Check out Vellum dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/vellum
          ref: 898affc1860869ab7fd4d4de369ca3556bc12aaf
          path: vellum
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Fetch locked dependencies
        working-directory: moira-tui
        run: cargo fetch --locked
      - name: Audit current RustSec advisories
        working-directory: moira-tui
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings
      - name: Verify workspace
        working-directory: moira-tui
        run: make check
