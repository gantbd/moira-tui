name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out Moira TUI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: moira-tui
          persist-credentials: false
      - name: Check out Keystone dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/keystone
          ref: 2e4faf10ec0a70805aa1db1555f93c77fcf0a1e4
          path: keystone
          persist-credentials: false
      - name: Check out Aegis dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/aegis
          ref: b272106cf6d0093839a7d696c829bf8a408b0306
          path: aegis
          persist-credentials: false
      - name: Check out Agora dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/agora
          ref: 68cead6ab665c9646148f80818a7aeef92994543
          path: agora
          persist-credentials: false
      - name: Check out Chronos dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/chronos
          ref: ebff27188388cd0249d07751b1cc848c6ef1a3f9
          path: chronos
          persist-credentials: false
      - name: Check out Daimon dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/daimon
          ref: 325e662a6a945cf8a064b9812ebbbdac02be4130
          path: daimon
          persist-credentials: false
      - name: Check out Hermes dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/hermes
          ref: 3f60c1c7b00b1a61230508b11422ddfc84b61856
          path: hermes
          persist-credentials: false
      - name: Check out Moira dependency
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: gantbd/moira
          ref: f3861a142f2db399cb1ad3c2b352a4e695f65ecc
          path: moira
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Fetch locked dependencies
        working-directory: moira-tui
        run: cargo fetch --locked
      - name: Audit current RustSec advisories
        working-directory: moira-tui
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings
      - name: Verify workspace
        working-directory: moira-tui
        run: make check
