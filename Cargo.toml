[workspace]
resolver = "3"
members = ["local-client", "cli"]

[package]
name = "moira-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gantbd/moira-tui"
readme = "README.md"
publish = false
description = "Composable terminal presentation for Moira workflows"

[dependencies]
moira-client = { version = "=0.1.0", path = "../moira/crates/moira-client" }
moira-protocol = { version = "=0.1.0", path = "../moira/crates/moira-protocol" }
ratatui = { version = "=0.30.2", default-features = false }
crossterm = "=0.29.0"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
